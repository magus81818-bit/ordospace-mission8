# Render Blueprint — ORDOSPACE Mission 8 격리 리소스 전용
# 기존 ordospace-db / ordospace-backend 는 절대 사용하지 않는다.
databases:
  - name: ordospace-mission8-db
    plan: free
    region: singapore

services:
  - type: web
    name: ordospace-mission8-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ordospace-mission8-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: "production"
      - key: TOSS_MODE
        value: "test"
      - key: TOSS_API_BASE_URL
        value: "https://api.tosspayments.com"
      - key: TOSS_SECRET_KEY
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
